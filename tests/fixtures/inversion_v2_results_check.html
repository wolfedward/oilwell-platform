<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href=STYLE_MODULE><main id="root"></main><pre id="result">pending</pre>
<style>#result{display:none}body{padding:20px}#root{max-width:1200px;margin:auto}</style><script type="module">
const mode='FIXTURE_MODE',rows=ENCODED_ROWS,checks=[],calls=[];
const check=(value,label)=>{if(!value)throw Error(label);checks.push(label)};
const id='11111111-1111-4111-8111-111111111111',run='22222222-2222-4222-8222-222222222222',digest='a'.repeat(64),base='/api/production-inversion';
const refused=mode==='v2-refused',metric=value=>({value,unit:'1',reason:null});
const comparison={scope:'original_valid_support',prediction_status:refused?'not_applicable':'applicable',prediction_reason_codes:refused?['invalid_power_quality']:[],
 primary:{load_rmse:metric(refused?null:'0.1')},coverage:{joint_fraction:metric(refused?'0':'977/1024')},independence:{status:'not_independent',reason:'same_synthetic_cycle'}};
const detail={id,run_id:run,content_sha256:digest,snapshot_sha256:'b'.repeat(64),execution:'completed',source:'synthetic',review:{state:'unreviewed',version:0},
 current_applicability:{state:'applicable',reasons:[]},field_validation:{state:'not_field_validated',certified:false,independent_comparison:false},
 body:{schema:'inversion.result/2',point_count:1025,prediction_status:refused?'not_applicable':'applicable',prediction_reason_codes:refused?['insufficient_coverage']:[],
  source_proof:{status:'verified',reason_codes:[],case_id:'cycle-base',config_sha256:'c'.repeat(64)},parameter_core_sha256:'d'.repeat(64),
  cycle:{start_ns:'1790784000000000000',end_ns:'1790784008000000000'}}};
const json=data=>new Response(JSON.stringify({ok:true,data}),{headers:{'Content-Type':'application/json'}});
window.fetch=async path=>{const url=new URL(path,'http://fixture'),route=url.pathname;calls.push(path);
 if(route===base+'/results/'+id)return json(detail);
 if(route===base+'/runs/'+run)return json({run_id:run,state:'completed',result_id:id,request:{}});
 if(route.endsWith('/comparison'))return json({result_id:id,content_sha256:digest,comparison,filled_comparison:null});
 if(route.endsWith('/points')){const offset=Number(url.searchParams.get('offset'));return json({result_id:id,content_sha256:digest,offset,limit:1000,total:rows.length,rows:rows.slice(offset,offset+1000)});}
 throw Error('Unexpected '+path);
};
try{
 if(mode==='v2-report'){
  const style=document.querySelector('link');await new Promise((resolve,reject)=>{style.onload=resolve;style.onerror=reject;style.href=new URL('../testpack/styles.css',RESULTS_MODULE);});
  const {renderReport,renderCase}=await import(new URL('../testpack/viewer.js',RESULTS_MODULE));
  const root=document.querySelector('#root');renderReport(root,{schema:'owp.testpack.public-report/2',status:'incomplete',checks:[],layers:{},run_metadata:{},inversion_outcomes:rows});
  const accepted=root.querySelector('[data-inversion-outcome="cycle-base"]'),refused=root.querySelector('[data-inversion-outcome="guard-cancel"]');
  check(accepted?.textContent.includes('执行通过'),'approved execution visible');
  check(refused?.textContent.includes('断言通过')&&refused?.textContent.includes('已拒绝'),'expected rejection separate from successful execution');
  check(root.textContent.includes('0.08768016126631259'),'full precision original metric visible');
  check(document.documentElement.scrollWidth<=innerWidth+1,'public report responsive');
  renderCase(root,{case_id:'cycle-base',kind:'cycle',metadata:{frame_count:2,sample_rate_hz:128},capture:{frame_count:2,sample_rate_hz:128},
   reference_summary:{},reference:[],prediction:[],channels:{active_power:{values:[1,2],quality:[0,0],unit:'W'}},inversion_summary:rows[0]});
  check(root.textContent.includes('本报告有已批准的软件反演结果')&&!root.textContent.includes('当前没有已批准'),'case summary does not contradict actual approved report');
  check(root.querySelector('[data-trace-toggle="prediction"]').disabled,'missing packaged prediction never fabricated');
 }else{
 const {renderProductionResults}=await import(RESULTS_MODULE),{api}=await import(API_MODULE),root=document.querySelector('#root');
 await renderProductionResults({workspace:root,api,permissions:new Set(['inversion.read']),actorId:'77',authSession:{},
  capabilities:{production_inversion:{enabled:true,status:'ready'}},params:{result_id:id},page:{},pageHeader:()=>'<h1>反演结果 v2</h1>',isCurrent:()=>true,registerDispose:()=>{}});
 check(root.querySelector('[data-chart-kind="comparison"]'),'v2 result including proof rows loads');
 check(calls.filter(p=>p.includes('/points?')).length===4,'all3075 rows read1000+1000+1000+75');
 check(root.querySelector('[data-native-proof-count="1025"]'),'1025 native proofs visible');
 check(root.textContent.includes('同源合成周期')&&root.textContent.includes('不构成独立现场比较'),'same source not independent');
 check(root.textContent.includes('invalid_power_quality'),'exact point reason visible');
 const proof=root.querySelector('[data-native-proof-count]');proof.open=true;
 check(proof.textContent.includes('1.000000e-7'),'tiny bounds not rounded tozero');
 const chart=root.querySelector('[data-chart-kind="comparison"]'),pred=chart.querySelector('[data-series="prediction"]'),ref=chart.querySelector('[data-series="reference"]');
 check(chart.querySelector('circle').getAttribute('visibility')==='hidden','default marker hidden');
 for(const trace of ['prediction','reference']){const input=root.querySelector(`[data-trace-toggle="${trace}"]`);input.click();check(chart.querySelector(`[data-series="${trace}"]`).style.display==='none',trace+' independently hidden');input.click();}
 if(refused){check(!pred.childElementCount&&ref.querySelector('path'),'refusal preserves reference only');check(root.textContent.includes('insufficient_coverage'),'result refusal reason visible');}
 else{
  check(pred.querySelectorAll('path').length===2,'invalid prediction leaves two unjoined paths');
  const hit=chart.querySelector('[data-chart-hit]');hit.dispatchEvent(new KeyboardEvent('keydown',{key:'Home',bubbles:true}));
  const marker=chart.querySelector('circle'),svg=chart.querySelector('svg'),bounds=svg.getBoundingClientRect();
  hit.dispatchEvent(new PointerEvent('pointermove',{clientX:bounds.left+Number(marker.getAttribute('cx'))/720*bounds.width,clientY:bounds.top+Number(marker.getAttribute('cy'))/300*bounds.height,bubbles:true}));
  const tip=chart.querySelector('.inversion-tooltip').textContent;check(tip.includes('位移（m） 0.33')&&tip.includes('载荷（kN） 0.67'),'pointer xy two decimals');
  check(rows[0].values[rows[0].columns.indexOf('s_m')]==='1/3','original exact export value untouched');
 }
 check(document.documentElement.scrollWidth<=innerWidth+1,'responsive no horizontal overflow');
 proof.open=false;
 }
 document.querySelector('#result').textContent=JSON.stringify({ok:true,checks});
}catch(error){document.querySelector('#result').textContent=JSON.stringify({ok:false,error:error.stack,checks});}
</script></html>
