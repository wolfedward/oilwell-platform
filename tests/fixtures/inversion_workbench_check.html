<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href=STYLE_MODULE><div id="app"></div><main id="root"></main><pre id="result">pending</pre>
<style>#result{display:none}</style><script type="module">
const mode='FIXTURE_MODE',checks=[],calls=[];
const check=(value,label)=>{if(!value)throw Error(label);checks.push(label)};
const wait=async(fn)=>{const end=Date.now()+6000;while(!fn()){if(Date.now()>end)throw Error('timeout: '+fn);await new Promise(r=>setTimeout(r,10));}};
const id=n=>`${String(n).repeat(8)}-${String(n).repeat(4)}-4${String(n).repeat(3)}-8${String(n).repeat(3)}-${String(n).repeat(12)}`;
const assembly=id(1),parameter=id(2),model=id(3),dataset=id(4),version=id(5),pair=id(6),run=id(7),base='/api/production-inversion';
const pins={assembly_id:assembly,parameter_id:parameter,parameter_sha256:'a'.repeat(64),parameter_review_version:2,model_id:model,model_sha256:'b'.repeat(64),model_review_version:2};
const permissions=['inversion.read','inversion.run','waveform.read','waveform.raw.read','waveform.export'];
const json=(data,status=200,code='inversion.selection_changed')=>new Response(JSON.stringify(status>=400?{code,message:'Refused',details:{}}:{ok:true,data}),{status,headers:{'Content-Type':'application/json'}});
let refusePreflight=true,deny=false,holdPoll=false,held,aborted=false,runState='running';
window.fetch=async(path,options={})=>{
 const url=new URL(path,'http://fixture'),route=url.pathname;
 calls.push({path,method:options.method||'GET',body:options.body?JSON.parse(options.body):null});
 if(path==='/api/auth/me')return json({id:'77',username:'tester',permissions,role_code:'administrator',capabilities:{production_inversion:{enabled:mode!=='shell-disabled',status:mode==='shell-unavailable'?'degraded':'ready'}}});
 if(path==='/api/auth/logout')return json({});
 if(deny)return json({},403);
 if(route===base+'/assemblies')return json({offset:0,limit:100,items:[{id:assembly,version:1,body:{asset_number:'Assembly A'}}]});
 if(route.endsWith('/selections'))return json({offset:0,limit:1,items:[{id:assembly,version:3,body:pins}]});
 if(route===base+'/parameters/'+parameter)return json({id:parameter,content_sha256:pins.parameter_sha256,body:{provenance:{operating_conditions:[{id:'approved-condition',valid_from:'2026-01-01T00:00:00Z',valid_to:'2027-01-01T00:00:00Z'}]}}});
 if(route==='/api/waveforms/datasets')return json({page:1,page_size:100,has_more:false,snapshot_revision:'w1.r1.qfixture',received_before:'2026-10-10T00:00:00Z',items:[{dataset_id:dataset,title:'Frozen input',state:'frozen'}]});
 if(route==='/api/waveforms/datasets/'+dataset&&url.searchParams.get('view')==='members'){
  const second=url.searchParams.get('page')==='2';
  if(second)check(url.searchParams.has('snapshot_revision')&&url.searchParams.has('received_before'),'frozen members retain snapshot bounds');
  return json({page:second?2:1,page_size:100,has_more:!second,snapshot_revision:'w1.r1.qfixture',received_before:'2026-10-10T00:00:00Z',items:second?[{kind:'pair',reference_id:pair}]:Array.from({length:100},()=>({kind:'capture',reference_id:id(8)}))});
 }
 if(route==='/api/waveforms/datasets/'+dataset)return json({draft:{title:'Frozen input',state:'frozen'},version:{id:version,content_sha256:'c'.repeat(64)}});
 if(route==='/api/waveforms/pairs/'+pair)return json({id:pair,content_sha256:'d'.repeat(64),version:4,review_state:'approved',body:{}});
 if(route===base+'/runs/preflight')return refusePreflight?json({},409):json({allowed:true,missing:[],provisional:true,calculation_performed:false});
 if(route===base+'/runs'&&options.method==='POST')return json({run_id:run,version:1,state:'queued',result_id:null},202);
 if(route===base+'/runs/'+run+'/retry')return json({},403);
 if(route===base+'/runs/'+run+'/cancel')return json({run_id:run,version:2,state:'running',reason_code:'cancel_requested',cancelling:true});
 if(route===base+'/runs/'+run){
  if(holdPoll){options.signal.addEventListener('abort',()=>{aborted=true;held?.(json({run_id:run,state:'completed',result_id:'LATE'}))});return new Promise(resolve=>held=resolve)}
  return json({run_id:run,version:1,state:runState,reason_code:runState==='failed'?'worker_failed':null,result_id:null});
 }
 throw Error('Unexpected '+path);
};
try {
 const {renderProductionInversion,mountProductionInversion}=await import(WORKBENCH_MODULE);
 const {api}=await import(API_MODULE),root=document.querySelector('#root'),session={};
 const ctx=()=>({workspace:root,api,permissions:new Set(permissions),actorId:'77',authSession:session,capabilities:{production_inversion:{enabled:true,status:'ready'}},params:{},page:{},pageHeader:()=>'<h1>反演与双图验证</h1>',isCurrent:()=>true,registerDispose:()=>{}});
 if(mode==='client-methods'){
  const {createInversionClient}=await import(CLIENT_MODULE);
  for(const method of ['preflight','waveformGet','downloadExport']){
   const authority={...ctx(),authSession:{},permissions:new Set([...permissions,'inversion.export'])};
   const client=createInversionClient(authority);let methodCalls=0;
   window.fetch=async()=>{methodCalls++;return json({},403)};
   const invoke=c=>method==='preflight'?c.preflight({}):method==='waveformGet'?c.waveformGet('/datasets?state=frozen'):c.downloadExport(run,'result.json');
   try{await invoke(client)}catch{}
   const sameSession=createInversionClient({...authority,permissions:new Set(authority.permissions)});
   try{await sameSession.get('/runs')}catch{}
   check(methodCalls===1,method+' denial blocks every method and remount');
   client.dispose();sameSession.dispose();
   const fresh=createInversionClient({...authority,authSession:{}});let resolveRequest,signal;
   window.fetch=async(path,options)=>{signal=options.signal;return new Promise(resolve=>resolveRequest=resolve)};
   const pending=invoke(fresh);await wait(()=>resolveRequest);fresh.dispose();
   check(signal.aborted,method+' owned request aborts on dispose');
   resolveRequest(json({late:true}));check(await pending===null,method+' late completion suppressed');
  }
  const client=createInversionClient(ctx());
  for(const path of ['https://outside.test/raw','/captures/'+run+'/raw','/datasets/'+dataset+'?view=files']){
   let refused=false;try{await client.waveformGet(path)}catch{refused=true}check(refused,'metadata route refuses '+path);
  }
 }else if(mode.startsWith('shell-')){
  location.hash='#/production-inversion'+(mode==='shell-logout'?'?run_id='+run:'');
  await import(APP_MODULE);await wait(()=>document.querySelector('#workspace')?.getAttribute('aria-busy')==='false');
  const workspace=document.querySelector('#workspace');
  if(mode==='shell-disabled'||mode==='shell-unavailable'){
   check(workspace.querySelector('[data-inversion-state]')?.dataset.inversionState===(mode==='shell-disabled'?'disabled':'unavailable'),'actual shell direct route state');
   check(!calls.some(c=>c.path.startsWith(base)||c.path.startsWith('/api/waveforms')),'gated shell performs zero reads');
   check(!document.querySelector('#sidebar [data-page="production-results"]'),'results sidebar same gate');
   document.querySelector('[data-module="production-inversion"]').click();await wait(()=>workspace.getAttribute('aria-busy')==='false');
   check(!calls.some(c=>c.path.startsWith(base)),'module landing denied consistently');
  }else{
   check(document.querySelector('#sidebar [data-page="production-results"]'),'result route appears in real shell');
   check(document.querySelector('#sidebar [data-page="production-inversion"]'),'workbench route appears in real shell');
   if(mode==='shell-logout'){
    await wait(()=>workspace.textContent.includes('计算中'));holdPoll=true;await wait(()=>held);
    document.querySelector('#logoutButton').click();await wait(()=>aborted);
    const count=calls.length;await new Promise(r=>setTimeout(r,1700));
    check(!document.querySelector('#app').textContent.includes('LATE'),'late result cannot paint after real logout');
    check(calls.length===count,'logout stops poll timer');
   }
  }
 }else if(mode==='sticky-denial'){
  deny=true;await renderProductionInversion(ctx());const count=calls.length;
  deny=false;await renderProductionInversion(ctx());check(calls.length===count,'denial sticky through rerender');
  check(root.textContent.includes('无权'),'denial visible');
 }else{
  await renderProductionInversion(ctx());
  root.querySelector('[name="operating_condition_ids"]').click();
  const preflight=root.querySelector('[data-inversion-preflight]');preflight.click();
  await wait(()=>calls.some(c=>c.path.endsWith('/preflight')));await wait(()=>root.querySelector('.inversion-status').textContent.includes('重新读取')&&!preflight.disabled);
  check(!root.querySelector('[data-inversion-action="runs.create"]'),'stale selection refuses run submission');
  const sent=calls.find(c=>c.path.endsWith('/preflight')).body.body;
  check(sent.member_ordinal===100,'frozen ordinal retained before filtering capture members');
  check(sent.selection_version===3&&sent.pair_review_version===4,'actual selection and pair reviews pinned');
  check(sent.dataset_version_id===version,'explicit frozen version only');
  refusePreflight=false;preflight.click();await wait(()=>root.querySelector('[data-inversion-action="runs.create"]'));
  const form=root.querySelector('[data-inversion-action="runs.create"]');form.querySelector('[name="reason"]').value='Validated run';form.requestSubmit();
  await wait(()=>root.textContent.includes('计算中'));
  const cancel=root.querySelector('[data-inversion-action="runs.cancel"]');cancel.querySelector('[name="reason"]').value='Stop test';cancel.requestSubmit();
  await wait(()=>root.textContent.includes('正在取消'));check(!root.textContent.includes('已经停止'),'cancel_requested retains running status');
  runState='failed';await renderProductionInversion({...ctx(),params:{run_id:run}});
  const retry=root.querySelector('[data-inversion-action="runs.retry"]');retry.querySelector('[name="reason"]').value='Retry after inspection';retry.requestSubmit();
  await wait(()=>root.textContent.includes('无权'));const count=calls.length;
  retry.querySelector('[data-inversion-recover]').click();await new Promise(r=>setTimeout(r,50));
  check(calls.length===count,'revoked retry remains refused');
 }
 document.querySelector('#result').textContent=JSON.stringify({ok:true,checks});
}catch(error){document.querySelector('#result').textContent=JSON.stringify({ok:false,error:error.stack,checks});}
</script></html>
