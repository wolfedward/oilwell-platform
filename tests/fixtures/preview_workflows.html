<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../frontend/preview/preview.css"><main id="app"><div id="workspace" class="workspace"></div></main><div id="toastRegion"></div><pre id="result" hidden>pending</pre><script type="module">
try{const data=PREVIEW_DATA,{renderers}=await import('../../frontend/preview/renderers.js'),{createPreviewContext}=await import('../../frontend/preview/context.js');const missing=[],unknown_reads=[],overflow=[],check=(v,n)=>{if(!v)missing.push(n);},tick=()=>new Promise(r=>setTimeout(r,20));let current;
const api={get:async p=>{const k=p.split('?')[0];if(!(k in data.reads)){unknown_reads.push(k);throw Error(k);}return structuredClone(data.reads[k]);},post:async()=>{throw Error('unexpected write');},download:async()=>{}};
for(const id of ['approvals','commands','device-command','alarms','work-orders','reports','users','roles','audit','system-health','acceptance-center']){const w=document.querySelector('#workspace'),ctx=createPreviewContext({workspace:w,page:{id,label:id},params:{},session:{actor:data.actor},generation:()=>current===ctx,api,meta:{},navigate:()=>{},actions:{confirmRehearsal:async()=>({mode:'rehearsal'})}});current=ctx;await renderers[id](ctx);check(w.querySelector('h2'),'content-'+id);
if(id==='commands')check(!w.textContent.includes('数字签名通过'),'no-fake-signature');if(id==='acceptance-center')check(w.querySelectorAll('.evidence-card').length===12,'annual-12');
if(id==='users'){w.querySelector('#createUser')?.click();await tick();check(document.querySelector('.modal-overlay'),'user-modal');ctx.dispose();check(!document.querySelector('.modal-overlay'),'modal-disposed');}
if(id==='reports'){check(w.querySelector('select')?.options.length===6,'six-reports');for(const type of ['diagnosis','data-quality','strategy','energy','work-orders'])await renderers[id]({...ctx,params:{type}});}
if(document.documentElement.scrollWidth>innerWidth)overflow.push(id);await window.captureEvidence?.(id);ctx.dispose();}
document.querySelector('#result').textContent=JSON.stringify({pages_checked:11,missing,unknown_reads,overflow});}catch(e){document.querySelector('#result').textContent=JSON.stringify({error:e.stack});}
</script></html>
