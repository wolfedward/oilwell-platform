# Production broker template. Replace paths for the deployment host.
# A remotely reachable listener must use certificate validation and authentication.
listener 8883 0.0.0.0
allow_anonymous false
password_file C:/oilwell/config/mosquitto.password
acl_file C:/oilwell/config/mosquitto.acl

cafile C:/oilwell/certs/ca.crt
certfile C:/oilwell/certs/broker.crt
keyfile C:/oilwell/certs/private/broker.key
tls_version tlsv1.2

# Full MQTT packet limit includes headers/topic/properties, not only payload.
# Legal v1 payloads up to 1 MiB fit; quarantine hard ceiling is 2 MiB.
# Keep payload cap >= legal v1 and <= center quarantine hard ceiling.
max_packet_size 2097152
message_size_limit 2097152
# PUBACK alone is never an application storage confirmation.

persistence true
persistence_location C:/oilwell/data/mosquitto/
autosave_interval 60
log_type error
log_type warning
log_type notice
